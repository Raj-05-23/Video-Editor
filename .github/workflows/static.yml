name: Build OtakuKart Studio and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically embed custom emoji images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re, shutil

          html = Path('index.html').read_text(encoding='utf-8')
          source = Path('emojies')
          items = []
          for file in sorted(source.iterdir(), key=lambda p: p.name.casefold()) if source.is_dir() else []:
              if not file.is_file() or file.suffix.lower() not in {'.png','.webp','.gif'}:
                  continue
              if file.stat().st_size > 2_000_000:
                  print('Skipped oversized emoji:', file.name)
                  continue
              items.append({'name': file.name, 'base64': base64.b64encode(file.read_bytes()).decode('ascii')})

          payload = json.dumps(items, ensure_ascii=True, separators=(',', ':')).replace('<', r'\u003c')
          pattern = r'(<script\s+id="okBundledEmojiData"\s+type="application/json">).*?(</script>)'
          output, count = re.subn(pattern, lambda match: match.group(1)+payload+match.group(2), html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find custom emoji placeholder in index.html')

          site = Path('_site')
          site.mkdir(exist_ok=True)
          (site/'index.html').write_text(output, encoding='utf-8')
          (site/'.nojekyll').touch()
          for folder in ('assets', 'emojies'):
              if Path(folder).is_dir():
                  shutil.copytree(folder, site/folder, dirs_exist_ok=True)
          print(f'Bundled {len(items)} custom emojis into site HTML')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
